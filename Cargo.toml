[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
engine = { path = "crates/engine" }
dice = { path = "crates/dice" }
blob = { path = "crates/blob" }

wgpu = "30"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.34", features = ["bytemuck"] }
log = "0.4"
web-time = "1"
fontdue = "0.9"
egui = { version = "0.37", default-features = false }
egui-wgpu = { version = "0.37", default-features = false }
egui-winit = { version = "0.37", default-features = false }

# native only
pollster = "1"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }

# web only
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Storage", "Navigator", "Clipboard"] }
console_error_panic_hook = "0.1"
console_log = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# Keep dev builds of dependencies fast at runtime; our own code stays quick to compile.
[profile.dev.package."*"]
opt-level = 2
