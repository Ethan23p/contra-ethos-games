<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dice Merge · contra-ethos</title>
  <link data-trunk rel="rust" data-bin="dice" data-wasm-opt="z">
  <style>
    html, body { margin: 0; height: 100%; background: #0a0908; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100dvh; touch-action: none; outline: none; }
    #loading, #no-webgpu { position: fixed; inset: 0; display: grid; place-items: center; margin: 0;
                 color: #ddd; font: 16px/1.4 system-ui, sans-serif; text-align: center; padding: 16px; }
    #no-webgpu { place-content: center; gap: 8px; }
    #no-webgpu[hidden] { display: none; }
    #no-webgpu a { color: inherit; }
    #loading span { width: 14px; height: 14px; border-radius: 50%; background: #ddd;
                    animation: breathe 1.1s ease-in-out infinite alternate; }
    @keyframes breathe { from { opacity: .2; transform: scale(.7); } to { opacity: .9; transform: scale(1.3); } }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="loading" role="status" aria-label="Loading"><span></span></div>
  <div id="no-webgpu" hidden>
    <p>This game needs WebGPU, and this browser can't use it right now.</p>
    <p>Current Chrome, Edge, Safari and Firefox all have it. <a href="https://contra-ethos.com">Back to contra-ethos.com</a></p>
  </div>
  <script>
    (async () => {
      let adapter = null;
      try { adapter = await navigator.gpu?.requestAdapter(); } catch {}
      if (!adapter) {
        document.getElementById('loading')?.remove();
        document.getElementById('no-webgpu').hidden = false;
      }
    })();
  </script>
</body>
</html>
